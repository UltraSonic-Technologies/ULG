[package]
name = "ulg"
version = "0.1.0"
edition = "2024"
description = "Ultra Language Grammar: a declarative language-definition and code-generation toolkit"
license = "MIT"
repository = "https://github.com/UltraSonic-Technologies/ULG"
readme = "README.md"
keywords = ["language", "grammar", "lexer", "compiler", "codegen"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"

[[bin]]
name = "ulg"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["."]
resolver = "2"
