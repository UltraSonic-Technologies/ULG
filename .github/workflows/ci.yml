name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Build release binary
        run: cargo build --workspace --release
      - name: Verify example definition
        run: cargo run -- check examples/ultimatex/ultimatex.ulg
      - name: Verify UltimateX tokenization
        run: cargo run -- lex examples/ultimatex/ultimatex.ulg examples/ultimatex/main.ultix
      - name: Verify generated output
        run: cargo run -- generate rust examples/ultimatex/ultimatex.ulg --out target/generated
